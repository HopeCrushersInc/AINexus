name: Build WPF app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase*/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build WPF application
        run: dotnet build AINexus.App/AINexus.App.csproj --configuration Release
      - name: Run deterministic regression checks
        run: dotnet run --project AINexus.Checks/AINexus.Checks.csproj --configuration Release
